apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: app.rules
    rules:
    - alert: AppDown
      expr: absent(up{job="app-service"}) == 1
      for: 2m
      labels:
        severity: critical
        namespace: default
      annotations:
        summary: "App pod down"
        description: "app-service ka ek pod 2 minute se down hai."