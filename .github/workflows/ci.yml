name: CI - Build, Test & Push

on:
  push:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Set short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t bunny324/practice:${{ steps.vars.outputs.sha_short }} .

      - name: Scan image with Trivy
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 bunny324/practice:${{ steps.vars.outputs.sha_short }}

      - name: Push Docker image
        run: docker push bunny324/practice:${{ steps.vars.outputs.sha_short }}

      - name: Update image tag in Git (triggers ArgoCD sync)
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          sed -i '' "s|^  tag:.*|  tag: ${{ steps.vars.outputs.sha_short }}|" helm/devops-pipeline-app/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update image to ${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push origin HEAD:main
