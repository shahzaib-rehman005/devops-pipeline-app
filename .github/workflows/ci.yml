name: CI - Build, Test & Push

on:
  push:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Set short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t bunny324/practice:${{ steps.vars.outputs.sha_short }} .

      - name: Push Docker image
        run: docker push bunny324/practice:${{ steps.vars.outputs.sha_short }}

      - name: Deploy to local k3s
        run: |
          kubectl set image deployment/app-deployment app=bunny324/practice:${{ steps.vars.outputs.sha_short }}
          kubectl rollout status deployment/app-deployment
