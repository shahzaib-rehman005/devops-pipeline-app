replicaCount: 0

image:
  repository: bunny324/practice
  tag: "59696d6"

service:
  type: NodePort
  port: 3000
  nodePort: 30000

resources:
  requests:
    memory: "64Mi"
    cpu: "250m"
  limits:
    memory: "128Mi"
    cpu: "500m"

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilization: 50

monitoring:
  namespace: monitoring

slack:
  channel: "#general"

ingress:
  host: app.local

certManager:
  enabled: false