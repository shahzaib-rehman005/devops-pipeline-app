stages:
  - test
  - build

variables:
  IMAGE: bunny324/practice

test:
  stage: test
  tags:
    - self-hosted
  script:
    - npm install
    - npm test

build_and_push:
  stage: build
  tags:
    - self-hosted
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA .
    - trivy image --severity HIGH,CRITICAL --exit-code 0 $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
